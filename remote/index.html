<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChannelBox Remote</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#10141c;color:#edf2ff}*{box-sizing:border-box}body{margin:0;padding:24px 16px}main{max-width:370px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{font-size:21px;margin:0;letter-spacing:-.6px}.pill{font-size:11px;color:#a9b7ce;border:1px solid #354055;padding:6px 9px;border-radius:20px}.screen{background:#192333;border:1px solid #33465f;padding:18px;border-radius:18px;margin-bottom:18px;min-height:126px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#93b4da}#channel{font-size:25px;font-weight:650;margin:9px 0 6px;line-height:1.25;overflow-wrap:anywhere}#connection{font-size:12px;color:#9caec7;min-height:18px}.grid{display:grid;gap:9px}.three{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:repeat(2,1fr)}button{font:inherit;border:1px solid #354157;background:#202b3e;color:#eaf0ff;border-radius:13px;min-height:47px;cursor:pointer;transition:background .12s,transform .12s;touch-action:manipulation}button:hover{background:#30415c}button:active{transform:scale(.96);background:#405b83}button:focus-visible,input:focus-visible{outline:2px solid #85bcff;outline-offset:3px}.accent{background:#3975d1;border-color:#5b94eb;font-weight:650}.nav{margin:15px auto;max-width:250px;grid-template-columns:1fr 1.2fr 1fr;align-items:center}.nav button{min-height:57px}.up{grid-column:2}.close{grid-row:2}.ok{grid-row:2}.last{grid-row:2}.down{grid-column:2}.small{font-size:12px}.section{margin:17px 0 9px;font-size:11px;text-transform:uppercase;letter-spacing:1.7px;color:#8b9db6}.numbers button{font-size:22px;min-height:49px}.tune{display:flex;gap:8px;margin:14px 0}input{min-width:0;flex:1;background:#151e2b;border:1px solid #3a4960;color:white;border-radius:12px;padding:12px;font:inherit}.tune button{padding:0 17px}footer{text-align:center;color:#889bb7;font-size:11px;line-height:1.6;margin-top:19px}#error{color:#ffc67d;min-height:17px;font-size:12px;margin-top:9px}kbd{color:#b3c8e4}button span{display:block;color:#a7bbd6;font-size:10px;margin-top:3px}
</style>
<main>
<header><h1>ChannelBox Remote</h1><div class="pill">PI 5 · TEST PLAYER</div></header>
<div class="screen" aria-live="polite"><div class="eyebrow" id="mode">Now playing</div><div id="channel">Connecting…</div><div id="connection">Checking Pi 5</div><div id="error" role="status"></div></div>
<div class="grid three"><button data-key="b" class="accent">☰ Guide<span>B</span></button><button data-key="a">★ Favorite<span>A</span></button><button data-key="c">All / Favorites<span>C</span></button></div>
<div class="grid nav"><button class="up" data-key="up" aria-label="Up / channel up">▲<span>CH +</span></button><button class="close small" data-action="close">Close guide</button><button class="ok accent" data-key="enter">OK</button><button class="last small" data-key="d">Last<span>D</span></button><button class="down" data-key="down" aria-label="Down / channel down">▼<span>CH −</span></button></div>
<div class="grid three"><button data-key="x" aria-label="Volume down">VOL −</button><button data-key="m">Mute</button><button data-key="v" aria-label="Volume up">VOL +</button></div>
<div class="grid two" style="margin-top:9px"><button data-key="p">Play / Pause</button><button data-key="i">Channel info</button></div>
<div class="section">Jump to a channel</div><form class="tune"><input id="number" inputmode="numeric" pattern="[0-9]{1,5}" maxlength="5" placeholder="Channel number" aria-label="Channel number"><button class="accent" type="submit">Tune</button></form>
<div class="grid three numbers"><button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button><button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button><button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button><div></div><button data-key="0">0</button></div>
<footer>Arrows change channels or move through the guide.<br>Keyboard: <kbd>B</kbd> guide · <kbd>↑ ↓</kbd> move · <kbd>Enter</kbd> select<br>Controls only the Pi 5 test player.</footer>
</main>
<script>
const token='__TOKEN__';let chain=Promise.resolve(),busy=0;
const el=id=>document.getElementById(id);
async function send(data){busy++;try{const response=await fetch('/control',{method:'POST',headers:{'Content-Type':'application/json','X-Remote-Token':token},body:JSON.stringify(data),signal:AbortSignal.timeout(10000)});const r=await response.json();if(!r.ok)throw Error(r.error||'Command failed');el('channel').textContent=`${r.number} · ${r.name}`;el('mode').textContent=r.guide?'Guide open':'Now playing';el('connection').textContent=r.digits?`Entering channel ${r.digits}…`:`Connected · ${r.count.toLocaleString()} channels`;el('error').textContent='';}catch(e){el('error').textContent=e.message||'Connection failed';el('connection').textContent='Connection or command failed';}finally{busy--;}}
function queue(data){chain=chain.then(()=>send(data));}
document.querySelectorAll('button[data-key]').forEach(b=>b.addEventListener('click',()=>queue({action:'key',key:b.dataset.key})));
document.querySelector('[data-action="close"]').onclick=()=>queue({action:'close'});
document.querySelector('form').onsubmit=e=>{e.preventDefault();if(/^\d{1,5}$/.test(el('number').value))queue({action:'tune',number:el('number').value});};
document.addEventListener('keydown',e=>{if(e.target.closest('input')||(e.target.closest('button')&&['Enter',' '].includes(e.key))||e.metaKey||e.ctrlKey||e.altKey||e.repeat)return;const map={ArrowUp:'up',ArrowDown:'down',Enter:'enter'};const k=map[e.key]||e.key.toLowerCase();if(e.key==='Escape'){e.preventDefault();queue({action:'close'});}else if(/^[0-9abcdimpxv]$/.test(k)||map[e.key]){e.preventDefault();queue({action:'key',key:k});}});
send({action:'status'});setInterval(()=>{if(!busy&&!document.hidden)queue({action:'status'});},4000);
</script></html>
