name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Headless tests
        run: python -m unittest discover -s tests -v
      - name: Example listing
        run: python channelbox.py --playlist examples/channels.m3u.example --list-channels
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Whitespace
        run: git diff --check
